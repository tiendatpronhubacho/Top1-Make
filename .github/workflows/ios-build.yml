name: Build IpaProxy IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate PatchCatalog.dat from Patches
        run: |
          set -euo pipefail
          python3 tools/build_patch_catalog.py

      - name: Build IpaProxy for iOS
        run: |
          set -euo pipefail

          xcodebuild \
            -project ThreeOneOSSix.xcodeproj \
            -scheme 3106 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            PRODUCT_BUNDLE_IDENTIFIER=com.tiendat.ipaproxy \
            PRODUCT_NAME=IpaProxy \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          BUILD_DIR="build/DerivedData/Build/Products/Release-iphoneos"
          APP_PATH="$BUILD_DIR/IpaProxy.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: IpaProxy.app not found"
            echo "Contents of $BUILD_DIR:"
            ls -la "$BUILD_DIR" || true
            exit 1
          fi

          mkdir -p build/ios/ipa/Payload
          rm -rf build/ios/ipa/Payload/IpaProxy.app
          ditto "$APP_PATH" build/ios/ipa/Payload/IpaProxy.app

          APP_PLIST="build/ios/ipa/Payload/IpaProxy.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.tiendat.ipaproxy" "$APP_PLIST"

          # Hash the Mach-O __TEXT segment. Unlike the signature blob, this
          # segment is stable when the IPA is re-signed by the installer.
          EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PLIST")"
          EXECUTABLE_PATH="build/ios/ipa/Payload/IpaProxy.app/$EXECUTABLE_NAME"
          python3 - "$EXECUTABLE_PATH" "$APP_PLIST" <<'PY'
          import hashlib
          import plistlib
          import struct
          import sys

          executable_path, plist_path = sys.argv[1], sys.argv[2]
          with open(executable_path, "rb") as handle:
              binary = handle.read()

          if len(binary) < 32 or struct.unpack_from("<I", binary, 0)[0] != 0xfeedfacf:
              raise SystemExit("Expected a thin 64-bit arm64 Mach-O executable")

          command_count = struct.unpack_from("<I", binary, 16)[0]
          command_bytes = struct.unpack_from("<I", binary, 20)[0]
          if not command_count or command_count > 10000 or command_bytes > len(binary) - 32:
              raise SystemExit("Invalid Mach-O load-command table")

          cursor = 32
          command_end = 32 + command_bytes
          text_range = None
          for _ in range(command_count):
              if cursor + 8 > command_end:
                  raise SystemExit("Truncated Mach-O load command")
              command, command_size = struct.unpack_from("<II", binary, cursor)
              if command_size < 8 or cursor + command_size > command_end:
                  raise SystemExit("Invalid Mach-O load command size")
              if command == 0x19 and command_size >= 72:
                  segment_name = binary[cursor + 8:cursor + 24].split(b"\0", 1)[0]
                  if segment_name == b"__TEXT":
                      file_offset, file_size = struct.unpack_from("<QQ", binary, cursor + 40)
                      if not file_size or file_offset + file_size > len(binary):
                          raise SystemExit("Invalid __TEXT segment range")
                      text_range = (file_offset, file_offset + file_size)
                      break
              cursor += command_size

          if text_range is None:
              raise SystemExit("Mach-O __TEXT segment not found")

          digest = hashlib.sha256(binary[text_range[0]:text_range[1]]).hexdigest()
          with open(plist_path, "rb") as handle:
              info = plistlib.load(handle)
          info["IPAExecutableTextSHA256"] = digest
          with open(plist_path, "wb") as handle:
              plistlib.dump(info, handle, fmt=plistlib.FMT_BINARY, sort_keys=True)
          print("Executable __TEXT SHA-256:", digest)
          PY

          OFFICIAL_BUILD_ID="$(uuidgen | tr '[:upper:]' '[:lower:]')"
          /usr/libexec/PlistBuddy -c "Add :IPAOfficialBuildID string TIENDAT-OFFICIAL-BUILD-ID:$OFFICIAL_BUILD_ID" "$APP_PLIST"

          echo "OfficialBuildID: $OFFICIAL_BUILD_ID"
          cd build/ios/ipa
          /usr/bin/zip -qry IpaProxy-unsigned.ipa Payload

      - name: Verify Admin URL is not embedded in IPA
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile

          ipa_path = "build/ios/ipa/IpaProxy-unsigned.ipa"
          forbidden = (
              b"https://ipa-device-server.dat1888haizz.workers.dev/admin",
              b"http://ipa-device-server.dat1888haizz.workers.dev/admin",
          )

          with zipfile.ZipFile(ipa_path) as ipa:
              for entry in ipa.infolist():
                  if entry.is_dir():
                      continue
                  data = ipa.read(entry)
                  for value in forbidden:
                      if value in data:
                          raise SystemExit(
                              "ERROR: Admin URL found in IPA: " + entry.filename
                          )

          print("OK: Admin URL is not embedded in the IPA.")
          PY

      - name: Upload IPA and build products
        uses: actions/upload-artifact@v4
        with:
          name: IpaProxy-unsigned-iOS
          path: |
            build/ios/ipa/*.ipa
            build/DerivedData/Build/Products/Release-iphoneos/*.app
            build/DerivedData/Build/Products/Release-iphoneos/*.dSYM
          if-no-files-found: error
          retention-days: 14
