
workflows:
  ios-3106-unsigned:
    name: IpaProxy - Unsigned IPA
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Generate PatchCatalog.dat from Patches
        script: |
          set -euo pipefail
          python3 tools/build_patch_catalog.py

      - name: Build IpaProxy for iOS
        script: |
          set -euo pipefail

          xcodebuild \
            -project ThreeOneOSSix.xcodeproj \
            -scheme 3106 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            PRODUCT_BUNDLE_IDENTIFIER=com.tiendat.ipaproxy \
            PRODUCT_NAME=IpaProxy \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            build

      - name: Package unsigned IPA
        script: |
          set -euo pipefail

          BUILD_DIR="build/DerivedData/Build/Products/Release-iphoneos"
          APP_PATH="$BUILD_DIR/IpaProxy.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: IpaProxy.app not found"
            ls -la "$BUILD_DIR"
            exit 1
          fi

          mkdir -p build/ios/ipa/Payload
          rm -rf build/ios/ipa/Payload/IpaProxy.app

          ditto "$APP_PATH" build/ios/ipa/Payload/IpaProxy.app

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleIdentifier com.tiendat.ipaproxy" \
            build/ios/ipa/Payload/IpaProxy.app/Info.plist

          cd build/ios/ipa
          /usr/bin/zip -qry IpaProxy-unsigned.ipa Payload

    artifacts:
      - build/ios/ipa/*.ipa
      - build/DerivedData/Build/Products/Release-iphoneos/*.app
      - build/DerivedData/Build/Products/Release-iphoneos/*.dSYM

  ios-3106-signed:
    name: IpaProxy - Signed IPA
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      ios_signing:
        distribution_type: development
        bundle_identifier: com.tiendat.ipaproxy

    scripts:
      - name: Generate PatchCatalog.dat from Patches
        script: |
          set -euo pipefail
          python3 tools/build_patch_catalog.py

      - name: Apply provisioning profiles
        script: |
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          set -euo pipefail

          xcode-project build-ipa \
            --project ThreeOneOSSix.xcodeproj \
            --scheme 3106 \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
